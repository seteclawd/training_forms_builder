<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to HTML Converter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.header {
  background: #1a2744;
  color: #fff;
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  height: 48px;
}
.header a {
  color: #fff;
  text-decoration: none;
  font-size: 0.85rem;
  opacity: 0.8;
}
.header a:hover { opacity: 1; }
iframe {
  width: 100%;
  height: calc(100vh - 48px);
  border: none;
  display: block;
}
</style>
</head>
<body>
  <div class="header">
    <a href="/">← Back to Forms Builder</a>
  </div>
  <iframe src="https://text-html.com/" title="Text to HTML Converter" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
</body>
</html>

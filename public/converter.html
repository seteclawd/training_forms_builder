<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text ⇄ HTML Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  
  .header { background: #1a365d; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header h1 { color: #fff; font-size: 1.3rem; }
  .header a { color: #93c5fd; text-decoration: none; font-size: 0.9rem; }
  .header a:hover { text-decoration: underline; }
  
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  
  .toolbar { background: #1e293b; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar-group { display: flex; gap: 4px; align-items: center; padding-right: 12px; border-right: 1px solid #334155; }
  .toolbar-group:last-child { border-right: none; }
  .toolbar label { font-size: 0.8rem; color: #94a3b8; margin-right: 4px; }
  
  .btn { padding: 6px 12px; border: 1px solid #475569; border-radius: 6px; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
  .btn:hover { background: #475569; }
  .btn-primary { background: #1a365d; border-color: #2563eb; }
  .btn-primary:hover { background: #1e40af; }
  .btn-danger { background: #7f1d1d; border-color: #dc2626; }
  .btn-danger:hover { background: #991b1b; }
  
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 220px); min-height: 400px; }
  
  .panel { background: #1e293b; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { background: #334155; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
  .panel-content { flex: 1; overflow: auto; }
  
  .editor-toolbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px; background: #2d3748; border-bottom: 1px solid #4a5568; align-items: center; }
  .editor-toolbar button { padding: 4px 10px; border: 1px solid #4a5568; border-radius: 4px; background: #374151; color: #e2e8f0; cursor: pointer; font-size: 0.85rem; }
  .editor-toolbar button:hover { background: #4b5563; }
  .editor-toolbar .sep { width: 1px; background: #4a5568; margin: 0 4px; align-self: stretch; }
  .editor-toolbar select { padding: 4px 6px; border: 1px solid #4a5568; border-radius: 4px; background: #374151; color: #e2e8f0; font-size: 0.8rem; }
  .editor-toolbar .color-input { width: 28px; height: 28px; border: 1px solid #4a5568; border-radius: 4px; cursor: pointer; padding: 0; }
  
  #visualEditor { min-height: 300px; padding: 16px; outline: none; color: #e2e8f0; font-size: 14px; line-height: 1.6; }
  #visualEditor ul, #visualEditor ol { padding-left: 24px; margin: 8px 0; }
  #visualEditor h1, #visualEditor h2, #visualEditor h3 { color: #fff; margin: 12px 0 8px; }
  #visualEditor h1 { font-size: 1.5rem; }
  #visualEditor h2 { font-size: 1.3rem; }
  #visualEditor h3 { font-size: 1.1rem; }
  #visualEditor table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  #visualEditor td, #visualEditor th { border: 1px solid #4a5568; padding: 8px; }
  
  #htmlCode { width: 100%; height: 100%; padding: 16px; background: #0f172a; color: #93c5fd; border: none; font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.5; resize: none; outline: none; tab-size: 2; }
  #textOutput { width: 100%; height: 100%; padding: 16px; background: #0f172a; color: #e2e8f0; border: none; font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.5; resize: none; outline: none; white-space: pre-wrap; }
  
  .view-tabs { display: flex; gap: 4px; }
  .view-tab { padding: 4px 12px; border: 1px solid #475569; border-radius: 4px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.8rem; }
  .view-tab.active { background: #1a365d; color: #fff; border-color: #2563eb; }
  
  /* Modal dialogs */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 420px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #334155; font-weight: 600; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .modal-header .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
  .modal-body { padding: 20px; }
  .modal-body .field { margin-bottom: 14px; }
  .modal-body .field label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
  .modal-body .field input, .modal-body .field select { width: 100%; padding: 8px 12px; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; font-size: 0.9rem; }
  .modal-body .field-row { display: flex; gap: 12px; align-items: center; }
  .modal-body .field-row .field { flex: 1; }
  .modal-body .field-row .x { font-size: 1.2rem; color: #64748b; }
  .modal-body .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .modal-body .checkbox-row input { width: auto; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid #334155; display: flex; justify-content: flex-end; gap: 8px; }
  .modal-footer .btn { padding: 8px 20px; }
  .modal-tabs { display: flex; gap: 0; border-bottom: 1px solid #334155; }
  .modal-tab { padding: 10px 20px; cursor: pointer; font-size: 0.85rem; color: #94a3b8; border-bottom: 2px solid transparent; }
  .modal-tab.active { color: #fff; border-bottom-color: #2563eb; }
  .modal-tab-content { display: none; padding: 16px 0; }
  .modal-tab-content.active { display: block; }
  
  @media (max-width: 768px) { .panels { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>📝 Text ⇄ HTML Converter</h1>
  <a href="/">← Back to Forms</a>
</div>

<div class="container">
  <div class="toolbar">
    <div class="toolbar-group">
      <label>Direction:</label>
      <button class="btn btn-primary" onclick="convert('text2html')">Text → HTML</button>
      <button class="btn btn-primary" onclick="convert('html2text')">HTML → Text</button>
    </div>
    <div class="toolbar-group">
      <label>Clean HTML:</label>
      <button class="btn" onclick="cleanHtml('styles')" title="Remove inline styles">Inline Styles</button>
      <button class="btn" onclick="cleanHtml('classes')" title="Remove classes & IDs">Classes & IDs</button>
      <button class="btn" onclick="cleanHtml('empty')" title="Remove empty tags">Empty Tags</button>
      <button class="btn" onclick="cleanHtml('all')" title="Clean all">Clean All</button>
    </div>
    <div class="toolbar-group">
      <label>Convert:</label>
      <button class="btn" onclick="convertEntities('decode')">Entities → Text</button>
      <button class="btn" onclick="convertEntities('encode')">Text → Entities</button>
    </div>
    <div class="toolbar-group">
      <button class="btn" onclick="copyHtml()">📋 Copy HTML</button>
      <button class="btn" onclick="copyText()">📋 Copy Text</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑 Clear</button>
    </div>
  </div>

  <div class="panels">
    <!-- Left Panel: Visual Editor / HTML Input -->
    <div class="panel">
      <div class="panel-header">
        <span>Visual Editor / HTML</span>
        <div class="view-tabs">
          <button class="view-tab active" onclick="switchLeftView('visual')">Visual</button>
          <button class="view-tab" onclick="switchLeftView('html')">HTML Code</button>
        </div>
      </div>
      <div class="panel-content">
        <div id="visualToolbar" class="editor-toolbar">
          <button onclick="execCmd('bold')" title="Bold"><b>B</b></button>
          <button onclick="execCmd('italic')" title="Italic"><i>I</i></button>
          <button onclick="execCmd('underline')" title="Underline"><u>U</u></button>
          <button onclick="execCmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
          <span class="sep"></span>
          <select onchange="if(this.value){execCmd('formatBlock',this.value);this.value='';}" title="Paragraph format">
            <option value="">Format</option>
            <option value="H1">Heading 1</option>
            <option value="H2">Heading 2</option>
            <option value="H3">Heading 3</option>
            <option value="H4">Heading 4</option>
            <option value="H5">Heading 5</option>
            <option value="H6">Heading 6</option>
            <option value="P">Paragraph</option>
            <option value="PRE">Preformatted</option>
            <option value="BLOCKQUOTE">Blockquote</option>
          </select>
          <span class="sep"></span>
          <button onclick="execCmd('superscript')" title="Superscript">X²</button>
          <button onclick="execCmd('subscript')" title="Subscript">X₂</button>
          <button onclick="execCmd('removeFormat')" title="Clear formatting">Ix</button>
          <span class="sep"></span>
          <select onchange="if(this.value){execCmd('insertUnorderedList',this.value);this.value='';}" title="Bullet list style">
            <option value="">• List</option>
            <option value="disc">● Disc</option>
            <option value="circle">○ Circle</option>
            <option value="square">■ Square</option>
          </select>
          <select onchange="if(this.value){execCmd('insertOrderedList',this.value);this.value='';}" title="Numbered list style">
            <option value="">1. List</option>
            <option value="1">1, 2, 3 (Default)</option>
            <option value="a">a, b, c (Lower Alpha)</option>
            <option value="i">i, ii, iii (Lower Roman)</option>
            <option value="I">I, II, III (Upper Roman)</option>
            <option value="A">A, B, C (Upper Alpha)</option>
            <option value="greek">α, β, γ (Lower Greek)</option>
          </select>
          <span class="sep"></span>
          <button onclick="execCmd('justifyLeft')" title="Align left">⫷</button>
          <button onclick="execCmd('justifyCenter')" title="Center">☰</button>
          <button onclick="execCmd('justifyRight')" title="Align right">⫸</button>
          <button onclick="execCmd('justifyFull')" title="Justify">☰☰</button>
          <span class="sep"></span>
          <label title="Text color" style="display:flex;align-items:center;gap:2px;margin:0;">
            <span style="font-size:0.75rem;">A</span>
            <input type="color" class="color-input" value="#e2e8f0" onchange="execCmd('foreColor',this.value)" title="Text color">
          </label>
          <label title="Highlight/BG color" style="display:flex;align-items:center;gap:2px;margin:0;">
            <span style="font-size:0.75rem;">🖍</span>
            <input type="color" class="color-input" value="#ffff00" onchange="execCmd('hiliteColor',this.value)" title="Highlight color">
          </label>
          <span class="sep"></span>
          <button onclick="openLinkDialog()" title="Insert/edit link">🔗</button>
          <button onclick="openImageDialog()" title="Insert/edit image">🖼️</button>
          <button onclick="insertTable()" title="Insert table">📊</button>
          <span class="sep"></span>
          <button onclick="execCmd('insertHorizontalRule')" title="Horizontal line">—</button>
          <button onclick="execCmd('undo')" title="Undo">↩</button>
          <button onclick="execCmd('redo')" title="Redo">↪</button>
        </div>
        <div id="visualEditor" contenteditable="true"></div>
        <textarea id="htmlCode" style="display:none;" placeholder="Paste HTML here..."></textarea>
      </div>
    </div>

    <!-- Right Panel: Text Output / HTML Output -->
    <div class="panel">
      <div class="panel-header">
        <span>Text Output</span>
        <div class="view-tabs">
          <button class="view-tab active" onclick="switchRightView('text')">Plain Text</button>
          <button class="view-tab" onclick="switchRightView('html')">HTML</button>
        </div>
      </div>
      <div class="panel-content">
        <textarea id="textOutput" placeholder="Text output will appear here..."></textarea>
        <textarea id="htmlOutput" style="display:none;" placeholder="HTML output will appear here..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Insert/Edit Link Modal -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <div class="modal-header">
      <span>Insert link</span>
      <button class="close-btn" onclick="closeModal('linkModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>URL</label><input type="text" id="linkUrl" placeholder="https://"></div>
      <div class="field"><label>Text to display</label><input type="text" id="linkText"></div>
      <div class="field"><label>Title</label><input type="text" id="linkTitle" placeholder="Optional title text"></div>
      <div class="field"><label>Target</label>
        <select id="linkTarget">
          <option value="">None</option>
          <option value="_blank">New window (_blank)</option>
          <option value="_self">Same window (_self)</option>
          <option value="_parent">Parent (_parent)</option>
          <option value="_top">Top (_top)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('linkModal')">Cancel</button>
      <button class="btn btn-primary" onclick="insertLink()">Ok</button>
    </div>
  </div>
</div>

<!-- Insert/Edit Image Modal -->
<div class="modal-overlay" id="imageModal">
  <div class="modal">
    <div class="modal-header">
      <span>Insert/edit image</span>
      <button class="close-btn" onclick="closeModal('imageModal')">✕</button>
    </div>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchImageTab('general')">General</div>
      <div class="modal-tab" onclick="switchImageTab('advanced')">Advanced</div>
    </div>
    <div class="modal-body">
      <div class="modal-tab-content active" id="imageTabGeneral">
        <div class="field"><label>Source</label><input type="text" id="imgSrc" placeholder="https://"></div>
        <div class="field"><label>Image description (alt)</label><input type="text" id="imgAlt"></div>
        <div class="field-row">
          <div class="field"><label>Width</label><input type="number" id="imgWidth" placeholder="px"></div>
          <span class="x">×</span>
          <div class="field"><label>Height</label><input type="number" id="imgHeight" placeholder="px"></div>
          <div class="checkbox-row" style="margin-top:18px;">
            <input type="checkbox" id="imgConstrain" checked>
            <label for="imgConstrain" style="font-size:0.8rem;">Constrain proportions</label>
          </div>
        </div>
      </div>
      <div class="modal-tab-content" id="imageTabAdvanced">
        <div class="field"><label>Style</label><input type="text" id="imgStyle" placeholder="e.g. float:left;margin:8px;"></div>
        <div class="field"><label>Classes</label><input type="text" id="imgClass" placeholder="e.g. responsive"></div>
        <div class="field"><label>ID</label><input type="text" id="imgId" placeholder="Optional"></div>
        <div class="field"><label>Title</label><input type="text" id="imgTitle" placeholder="Optional"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('imageModal')">Cancel</button>
      <button class="btn btn-primary" onclick="insertImage()">Ok</button>
    </div>
  </div>
</div>

<!-- Insert Table Modal -->
<div class="modal-overlay" id="tableModal">
  <div class="modal">
    <div class="modal-header">
      <span>Insert table</span>
      <button class="close-btn" onclick="closeModal('tableModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Columns</label><input type="number" id="tableCols" value="3" min="1" max="20"></div>
        <div class="field"><label>Rows</label><input type="number" id="tableRows" value="3" min="1" max="50"></div>
      </div>
      <div class="field"><label>Width</label><input type="text" id="tableWidth" placeholder="e.g. 100% or 500px"></div>
      <div class="checkbox-row"><input type="checkbox" id="tableBorder" checked><label for="tableBorder">Border</label></div>
      <div class="checkbox-row"><input type="checkbox" id="tableHeader" checked><label for="tableHeader">Header row</label></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('tableModal')">Cancel</button>
      <button class="btn btn-primary" onclick="insertTableConfirm()">Ok</button>
    </div>
  </div>
</div>

<script>
function execCmd(command, value) {
  document.execCommand(command, false, value || null);
  syncVisualToHtml();
}

// ===== Link Dialog =====
let savedSelection = null;
function saveSelection() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    savedSelection = sel.getRangeAt(0).cloneRange();
  }
}

function openLinkDialog() {
  saveSelection();
  const sel = window.getSelection();
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkText').value = sel.toString() || '';
  document.getElementById('linkTitle').value = '';
  document.getElementById('linkTarget').value = '';
  openModal('linkModal');
}

function insertLink() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
  const url = document.getElementById('linkUrl').value;
  if (!url) return;
  const text = document.getElementById('linkText').value || url;
  const title = document.getElementById('linkTitle').value;
  const target = document.getElementById('linkTarget').value;
  let html = `<a href="${esc(url)}"`;
  if (title) html += ` title="${esc(title)}"`;
  if (target) html += ` target="${target}"`;
  html += `>${esc(text)}</a>`;
  document.execCommand('insertHTML', false, html);
  closeModal('linkModal');
  syncVisualToHtml();
}

// ===== Image Dialog =====
function openImageDialog() {
  saveSelection();
  document.getElementById('imgSrc').value = '';
  document.getElementById('imgAlt').value = '';
  document.getElementById('imgWidth').value = '';
  document.getElementById('imgHeight').value = '';
  document.getElementById('imgStyle').value = '';
  document.getElementById('imgClass').value = '';
  document.getElementById('imgId').value = '';
  document.getElementById('imgTitle').value = '';
  openModal('imageModal');
}

function insertImage() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
  const src = document.getElementById('imgSrc').value;
  if (!src) return;
  const alt = document.getElementById('imgAlt').value;
  const w = document.getElementById('imgWidth').value;
  const h = document.getElementById('imgHeight').value;
  const style = document.getElementById('imgStyle').value;
  const cls = document.getElementById('imgClass').value;
  const id = document.getElementById('imgId').value;
  const title = document.getElementById('imgTitle').value;
  let html = '<img src="' + esc(src) + '"';
  if (alt) html += ' alt="' + esc(alt) + '"';
  if (title) html += ' title="' + esc(title) + '"';
  if (id) html += ' id="' + esc(id) + '"';
  if (cls) html += ' class="' + esc(cls) + '"';
  let css = '';
  if (w) css += 'width:' + w + 'px;';
  if (h) css += 'height:' + h + 'px;';
  if (style) css += style;
  if (css) html += ' style="' + esc(css) + '"';
  html += '>';
  document.execCommand('insertHTML', false, html);
  closeModal('imageModal');
  syncVisualToHtml();
}

function switchImageTab(tab) {
  document.querySelectorAll('.modal-tabs .modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.modal-tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'general') {
    document.querySelector('.modal-tabs .modal-tab:first-child').classList.add('active');
    document.getElementById('imageTabGeneral').classList.add('active');
  } else {
    document.querySelector('.modal-tabs .modal-tab:last-child').classList.add('active');
    document.getElementById('imageTabAdvanced').classList.add('active');
  }
}

// ===== Table Dialog =====
function insertTable() {
  document.getElementById('tableCols').value = 3;
  document.getElementById('tableRows').value = 3;
  document.getElementById('tableWidth').value = '100%';
  document.getElementById('tableBorder').checked = true;
  document.getElementById('tableHeader').checked = true;
  openModal('tableModal');
}

function insertTableConfirm() {
  const cols = parseInt(document.getElementById('tableCols').value) || 3;
  const rows = parseInt(document.getElementById('tableRows').value) || 3;
  const width = document.getElementById('tableWidth').value || '100%';
  const border = document.getElementById('tableBorder').checked;
  const hasHeader = document.getElementById('tableHeader').checked;
  let html = '<table style="border-collapse:collapse;width:' + esc(width) + ';"';
  if (border) html += ' border="1"';
  html += '>\n';
  for (let r = 0; r < rows; r++) {
    html += '<tr>\n';
    for (let c = 0; c < cols; c++) {
      const tag = (r === 0 && hasHeader) ? 'th' : 'td';
      html += '<' + tag + '>&nbsp;</' + tag + '>\n';
    }
    html += '</tr>\n';
  }
  html += '</table><p></p>';
  document.execCommand('insertHTML', false, html);
  closeModal('tableModal');
  syncVisualToHtml();
}

// ===== Modal helpers =====
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function esc(str) { return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function insertTable() {
  openModal('tableModal');
}

function syncVisualToHtml() {
  document.getElementById('htmlCode').value = document.getElementById('visualEditor').innerHTML;
}

function syncHtmlToVisual() {
  document.getElementById('visualEditor').innerHTML = document.getElementById('htmlCode').value;
}

function switchLeftView(view) {
  document.querySelectorAll('.view-tabs')[0].querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  if (view === 'visual') {
    document.getElementById('visualEditor').style.display = 'block';
    document.getElementById('htmlCode').style.display = 'none';
    document.getElementById('visualToolbar').style.display = 'flex';
    syncHtmlToVisual();
    // Auto-show HTML output on right
    switchRightView('html');
    document.querySelectorAll('.view-tabs')[0].querySelectorAll('.view-tab')[0].classList.add('active');
  } else {
    document.getElementById('visualEditor').style.display = 'none';
    document.getElementById('htmlCode').style.display = 'block';
    document.getElementById('visualToolbar').style.display = 'none';
    syncVisualToHtml();
    document.querySelectorAll('.view-tabs')[0].querySelectorAll('.view-tab')[1].classList.add('active');
  }
}

function switchRightView(view) {
  document.querySelectorAll('.view-tabs')[1].querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  if (view === 'text') {
    document.getElementById('textOutput').style.display = 'block';
    document.getElementById('htmlOutput').style.display = 'none';
    document.querySelectorAll('.view-tabs')[1].querySelectorAll('.view-tab')[0].classList.add('active');
  } else {
    document.getElementById('textOutput').style.display = 'none';
    document.getElementById('htmlOutput').style.display = 'block';
    document.querySelectorAll('.view-tabs')[1].querySelectorAll('.view-tab')[1].classList.add('active');
  }
}

function getLeftContent() {
  if (document.getElementById('visualEditor').style.display !== 'none') {
    return document.getElementById('visualEditor').innerHTML;
  }
  return document.getElementById('htmlCode').value;
}

function setRightContent(text, html) {
  document.getElementById('textOutput').value = text;
  document.getElementById('htmlOutput').value = html;
}

// Text to HTML
function textToHtml(text) {
  let html = text;
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/(?:^|<br>)[•\-\*]\s*(.+?)(?=<br>|$)/g, '<li>$1</li>');
  html = html.replace(/(<li>.*?<\/li>)+/g, '<ul>$&</ul>');
  html = html.replace(/(?:^|<br>)\d+\.\s*(.+?)(?=<br>|$)/g, '<oli>$1</oli>');
  html = html.replace(/(<oli>.*?<\/oli>)+/g, (match) => '<ol>' + match.replace(/<\/?oli>/g, (m) => m === '<oli>' ? '<li>' : '</li>') + '</ol>');
  return html;
}

// HTML to Text
function htmlToText(html) {
  let text = html;
  text = text.replace(/<\/(p|div|br|h[1-6]|li|tr)>/gi, '\n');
  text = text.replace(/<(br|hr)\s*\/?>/gi, '\n');
  text = text.replace(/<li[^>]*>/gi, '• ');
  text = text.replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n');
  text = text.replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n');
  text = text.replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n');
  text = text.replace(/<h4[^>]*>(.*?)<\/h4>/gi, '#### $1\n');
  text = text.replace(/<strong[^>]*>(.*?)<\/strong>/gi, '*$1*');
  text = text.replace(/<b[^>]*>(.*?)<\/b>/gi, '*$1*');
  text = text.replace(/<em[^>]*>(.*?)<\/em>/gi, '_$1_');
  text = text.replace(/<i[^>]*>(.*?)<\/i>/gi, '_$1_');
  text = text.replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi, '$2 ($1)');
  text = text.replace(/<\/t[dh]>/gi, '\t');
  text = text.replace(/<\/tr>/gi, '\n');
  text = text.replace(/<[^>]*>/g, '');
  text = text.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"');
  text = text.replace(/\n{3,}/g, '\n\n');
  return text.trim();
}

function convert(direction) {
  if (direction === 'text2html') {
    const text = document.getElementById('textOutput').value;
    const html = textToHtml(text);
    document.getElementById('htmlOutput').value = html;
    switchRightView('html');
  } else {
    const html = getLeftContent();
    const text = htmlToText(html);
    setRightContent(text, html);
  }
}

function cleanHtml(type) {
  let html = document.getElementById('htmlCode').value || document.getElementById('visualEditor').innerHTML;
  if (type === 'styles' || type === 'all') {
    html = html.replace(/\s*style="[^"]*"/gi, '');
  }
  if (type === 'classes' || type === 'all') {
    html = html.replace(/\s*class="[^"]*"/gi, '');
    html = html.replace(/\s*id="[^"]*"/gi, '');
  }
  if (type === 'empty' || type === 'all') {
    html = html.replace(/<(\w+)(?:\s[^>]*)?>\s*<\/\1>/gi, '');
    html = html.replace(/<(br|hr)\s*\/?>\s*<(br|hr)\s*\/?>/gi, '<br>');
  }
  document.getElementById('htmlCode').value = html;
  document.getElementById('visualEditor').innerHTML = html;
  document.getElementById('htmlOutput').value = html;
}

function convertEntities(mode) {
  if (mode === 'decode') {
    let html = getLeftContent();
    const ta = document.createElement('textarea');
    ta.innerHTML = html;
    const decoded = ta.value;
    document.getElementById('textOutput').value = decoded;
    document.getElementById('htmlOutput').value = decoded;
  } else {
    const text = document.getElementById('textOutput').value;
    const encoded = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    document.getElementById('htmlOutput').value = encoded;
  }
}

function copyHtml() {
  const html = document.getElementById('htmlOutput').value || document.getElementById('htmlCode').value;
  navigator.clipboard.writeText(html).then(() => alert('HTML copied!'));
}

function copyText() {
  const text = document.getElementById('textOutput').value;
  navigator.clipboard.writeText(text).then(() => alert('Text copied!'));
}

function clearAll() {
  document.getElementById('visualEditor').innerHTML = '';
  document.getElementById('htmlCode').value = '';
  document.getElementById('textOutput').value = '';
  document.getElementById('htmlOutput').value = '';
}

document.getElementById('visualEditor').addEventListener('input', function() {
  syncVisualToHtml();
  // Auto-update HTML output in real-time
  document.getElementById('htmlOutput').value = document.getElementById('htmlCode').value;

document.getElementById('htmlCode').addEventListener('input', function() {
  syncHtmlToVisual();
  document.getElementById('htmlOutput').value = document.getElementById('htmlCode').value;
